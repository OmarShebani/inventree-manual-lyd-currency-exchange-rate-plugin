[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-lyd-individual-exchange"
version = "0.1.0"
description = "LYD Exchange Rates for InvenTree — Individual Overrides"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Omar Shebani"}]
classifiers = ["Framework :: InvenTree", "Programming Language :: Python :: 3"]

[project.urls]
Repository = "https://github.com/blank404-sh/inventree-manual-lyd-currency-exchange-rate-plugin"

[project.entry-points."inventree_plugins"]
IndividualLYDExchange = "inventree_lyd_individual.plugin:IndividualLYDExchange"

[tool.setuptools.packages.find]
include = ["inventree_lyd_individual*"]

[tool.setuptools.package-data]
inventree_lyd_individual = ["static/*.js"]
